<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - LIC EMS</title>
    <style>
      body { margin: 0; font-family: Inter, sans-serif; background: #041e42; color: #e2e8f0; display: grid; place-items: center; min-height: 100vh; }
      .card { max-width: 28rem; padding: 2rem; border-radius: 2rem; background: rgba(15, 61, 145, 0.18); box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
      h1 { margin: 0 0 1rem; font-size: clamp(2rem, 4vw, 2.75rem); }
      p { margin: 0 0 1.25rem; line-height: 1.8; color: #cbd5e1; }
      a { color: #fbbf24; text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Offline mode</h1>
      <p>The LIC Enterprise Management System is currently offline. Please reconnect to the internet and reload the app.</p>
      <p><a href="/">Return home</a></p>
    </div>
  </body>
</html>
